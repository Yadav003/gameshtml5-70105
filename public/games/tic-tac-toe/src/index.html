<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic Tac Toe</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-width: 280px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(145deg, #f45135, #f6a43a);
        color: #281d1b;
        font-family: "Trebuchet MS", sans-serif;
      }

      main {
        width: min(100%, 360px);
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-family: "Comic Sans MS", cursive, sans-serif;
        font-size: clamp(2rem, 10vw, 3rem);
      }

      #status {
        min-height: 1.5em;
        margin: 0 0 20px;
        font-size: 1.1rem;
        font-weight: 700;
      }

      .mode-switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        margin-bottom: 16px;
        padding: 4px;
        border-radius: 8px;
        background: #fff3df;
      }

      .mode-switch button {
        min-width: 0;
        padding: 10px 6px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: #49322d;
        font:
          700 0.9rem "Trebuchet MS",
          sans-serif;
        cursor: pointer;
      }

      .mode-switch button[aria-pressed="true"] {
        background: #281d1b;
        color: white;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        width: 100%;
        aspect-ratio: 1;
        padding: 8px;
        gap: 8px;
        border-radius: 12px;
        background: #fff3df;
        box-shadow: 0 16px 36px #74251640;
      }

      .cell {
        display: grid;
        place-items: center;
        min-width: 0;
        border: 0;
        border-radius: 7px;
        background: #ffe2bd;
        color: #281d1b;
        font:
          700 clamp(2.5rem, 16vw, 4.5rem)/1 "Trebuchet MS",
          sans-serif;
        cursor: pointer;
      }

      .cell:hover:empty {
        background: #ffd39d;
      }
      .cell:focus-visible,
      #restart:focus-visible,
      .mode-switch button:focus-visible {
        outline: 3px solid #281d1b;
        outline-offset: 3px;
      }
      .cell:disabled {
        cursor: default;
      }
      .cell[data-mark="X"] {
        color: #b83e2d;
      }
      .cell[data-mark="O"] {
        color: #276e72;
      }

      #restart {
        margin-top: 20px;
        padding: 11px 20px;
        border: 0;
        border-radius: 6px;
        background: #281d1b;
        color: white;
        font:
          700 1rem "Trebuchet MS",
          sans-serif;
        cursor: pointer;
      }

      #restart:hover {
        background: #49322d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tic Tac Toe</h1>
      <div class="mode-switch" role="group" aria-label="Game mode">
        <button type="button" data-mode="computer" aria-pressed="true">
          Play vs Computer
        </button>
        <button type="button" data-mode="player" aria-pressed="false">
          Play vs Player
        </button>
      </div>
      <p id="status" aria-live="polite">Your turn (X)</p>
      <div class="board" role="group" aria-label="Tic Tac Toe board">
        <button
          class="cell"
          type="button"
          aria-label="Row 1, column 1"
        ></button>
        <button
          class="cell"
          type="button"
          aria-label="Row 1, column 2"
        ></button>
        <button
          class="cell"
          type="button"
          aria-label="Row 1, column 3"
        ></button>
        <button
          class="cell"
          type="button"
          aria-label="Row 2, column 1"
        ></button>
        <button
          class="cell"
          type="button"
          aria-label="Row 2, column 2"
        ></button>
        <button
          class="cell"
          type="button"
          aria-label="Row 2, column 3"
        ></button>
        <button
          class="cell"
          type="button"
          aria-label="Row 3, column 1"
        ></button>
        <button
          class="cell"
          type="button"
          aria-label="Row 3, column 2"
        ></button>
        <button
          class="cell"
          type="button"
          aria-label="Row 3, column 3"
        ></button>
      </div>
      <button id="restart" type="button">New game</button>
    </main>
    <script>
      const cells = Array.from(document.querySelectorAll(".cell"));
      const status = document.querySelector("#status");
      const modeButtons = Array.from(document.querySelectorAll("[data-mode]"));
      const winningLines = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6],
      ];
      let board = Array(9).fill("");
      let gameMode = "computer";
      let currentPlayer = "X";
      let gameOver = false;
      let computerThinking = false;
      let computerTimer;

      function hasWon(player) {
        return winningLines.some((line) =>
          line.every((index) => board[index] === player),
        );
      }

      function updateCells() {
        cells.forEach((cell) => {
          cell.disabled = gameOver || computerThinking;
        });
      }

      function finishGame() {
        if (hasWon(currentPlayer)) {
          status.textContent =
            gameMode === "computer" && currentPlayer === "O"
              ? "Computer wins!"
              : `${currentPlayer} wins!`;
          gameOver = true;
        } else if (board.every(Boolean)) {
          status.textContent = "It's a draw!";
          gameOver = true;
        } else {
          return false;
        }

        updateCells();
        return true;
      }

      function minimax(player, depth) {
        if (hasWon("O")) return 10 - depth;
        if (hasWon("X")) return depth - 10;
        if (board.every(Boolean)) return 0;

        const maximizing = player === "O";
        let bestScore = maximizing ? -Infinity : Infinity;
        board.forEach((square, index) => {
          if (square) return;
          board[index] = player;
          const score = minimax(maximizing ? "X" : "O", depth + 1);
          board[index] = "";
          bestScore = maximizing
            ? Math.max(bestScore, score)
            : Math.min(bestScore, score);
        });
        return bestScore;
      }

      function findComputerMove() {
        let bestMove = -1;
        let bestScore = -Infinity;
        board.forEach((square, index) => {
          if (square) return;
          board[index] = "O";
          const score = minimax("X", 1);
          board[index] = "";
          if (score > bestScore) {
            bestScore = score;
            bestMove = index;
          }
        });
        return bestMove;
      }

      function playMove(index) {
        if (gameOver || board[index]) return;

        board[index] = currentPlayer;
        cells[index].textContent = currentPlayer;
        cells[index].dataset.mark = currentPlayer;
        const row = Math.floor(index / 3) + 1;
        const column = (index % 3) + 1;
        cells[index].setAttribute(
          "aria-label",
          `Row ${row}, column ${column}, ${currentPlayer}`,
        );

        if (finishGame()) return;

        currentPlayer = currentPlayer === "X" ? "O" : "X";
        if (gameMode === "computer" && currentPlayer === "O") {
          computerThinking = true;
          status.textContent = "Computer thinking...";
          updateCells();
          computerTimer = setTimeout(() => {
            computerThinking = false;
            playMove(findComputerMove());
          }, 250);
        } else {
          status.textContent =
            gameMode === "computer"
              ? "Your turn (X)"
              : `${currentPlayer}'s turn`;
          updateCells();
        }
      }

      cells.forEach((cell, index) => {
        cell.addEventListener("click", () => {
          if (computerThinking) return;
          playMove(index);
        });
      });

      function resetGame() {
        clearTimeout(computerTimer);
        board = Array(9).fill("");
        cells.forEach((cell, index) => {
          cell.textContent = "";
          delete cell.dataset.mark;
          cell.setAttribute(
            "aria-label",
            `Row ${Math.floor(index / 3) + 1}, column ${(index % 3) + 1}`,
          );
        });
        currentPlayer = "X";
        gameOver = false;
        computerThinking = false;
        status.textContent =
          gameMode === "computer" ? "Your turn (X)" : "X's turn";
        updateCells();
      }

      modeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          gameMode = button.dataset.mode;
          modeButtons.forEach((modeButton) => {
            modeButton.setAttribute(
              "aria-pressed",
              String(modeButton === button),
            );
          });
          resetGame();
        });
      });

      document.querySelector("#restart").addEventListener("click", resetGame);
    </script>
  </body>
</html>
